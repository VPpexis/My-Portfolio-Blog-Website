<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title"><title id="title">Two workers, one remaining batch</title><rect width="960" height="620" rx="20" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="40" y="52" fill="#f8fafc" font-size="28" font-weight="700">Two workers, one remaining batch</text><rect x="40" y="82" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="119" fill="#f1f5f9" font-size="23">Alice locks the batch • 10 kg available</text><path d="M480 147v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="167" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="204" fill="#f1f5f9" font-size="23">Bob requests the same lock • Bob waits</text><path d="M480 232v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="252" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="289" fill="#f1f5f9" font-size="23">Alice deducts 7 kg and records the movement</text><path d="M480 317v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="337" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="374" fill="#f1f5f9" font-size="23">Alice commits • Lock released</text><path d="M480 402v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="422" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="459" fill="#f1f5f9" font-size="23">Bob acquires the lock • 3 kg remaining</text><path d="M480 487v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="507" width="880" height="60" rx="10" fill="#164e63" stroke="#475569"/><text x="62" y="544" fill="#f1f5f9" font-size="23">Bob needs 7 kg • Roll back without a deduction</text></g></svg>
