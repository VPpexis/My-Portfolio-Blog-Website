<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title"><title id="title">Consume stock safely</title><rect width="960" height="790" rx="20" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="40" y="52" fill="#f8fafc" font-size="28" font-weight="700">Consume stock safely</text><rect x="40" y="82" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="119" fill="#f1f5f9" font-size="23">1  Check identity and role • Otherwise return 401 / 403</text><path d="M480 147v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="167" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="204" fill="#f1f5f9" font-size="23">2  Validate request shape • Otherwise return 400</text><path d="M480 232v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="252" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="289" fill="#f1f5f9" font-size="23">3  Begin transaction and lock eligible batches</text><path d="M480 317v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="337" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="374" fill="#f1f5f9" font-size="23">4  Check stock • Insufficient? Roll back and return 409</text><path d="M480 402v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="422" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="459" fill="#f1f5f9" font-size="23">5  Compute FEFO allocations</text><path d="M480 487v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="507" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="544" fill="#f1f5f9" font-size="23">6  Update balances and write ledger entries</text><path d="M480 572v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="592" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="629" fill="#f1f5f9" font-size="23">7  Commit • Return 201 only when commit succeeds</text><path d="M480 657v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="677" width="880" height="60" rx="10" fill="#164e63" stroke="#475569"/><text x="62" y="714" fill="#f1f5f9" font-size="23">Any database error → handle error; do not report success</text></g></svg>
