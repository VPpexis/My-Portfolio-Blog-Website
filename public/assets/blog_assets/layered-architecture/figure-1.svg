<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img" aria-labelledby="title"><title id="title">The request path</title><rect width="960" height="535" rx="20" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="40" y="52" fill="#f8fafc" font-size="28" font-weight="700">The request path</text><rect x="40" y="82" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="119" fill="#f1f5f9" font-size="23">User • Sends a request</text><path d="M480 147v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="167" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="204" fill="#f1f5f9" font-size="23">Router • Receives HTTP and formats the response</text><path d="M480 232v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="252" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="289" fill="#f1f5f9" font-size="23">Service • Applies business rules</text><path d="M480 317v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="337" width="880" height="60" rx="10" fill="#1e293b" stroke="#475569"/><text x="62" y="374" fill="#f1f5f9" font-size="23">Repository • Reads or writes data</text><path d="M480 402v14m-5-5 5 5 5-5" fill="none" stroke="#67e8f9" stroke-width="2"/><rect x="40" y="422" width="880" height="60" rx="10" fill="#164e63" stroke="#475569"/><text x="62" y="459" fill="#f1f5f9" font-size="23">Database • Stores data and enforces constraints</text></g></svg>
